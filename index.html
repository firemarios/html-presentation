<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>HTML Slide Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1a1a;
            --bg-darker: #0f0f0f;
            --bg-panel: #252525;
            --border: #444;
            --accent: #2b579a;
            --text: #e0e0e0;
            --text-dim: #888;
            --slide-bg: #0d1117;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            height: 50px;
            background: var(--bg-darker);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
            gap: 12px;
            flex-shrink: 0;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .toolbar::-webkit-scrollbar {
            height: 0;
            width: 0;
        }

        .toolbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .toolbar-divider {
            width: 1px;
            height: 30px;
            background: var(--border);
            flex-shrink: 0;
        }

        .toolbar-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .toolbar-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Mobile tab bar (hidden on desktop) */
        .mobile-tabs {
            display: none;
        }

        .trans-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .trans-btn:hover,
        .trans-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 220px 1fr 1fr;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .main-container > * {
            min-height: 0;
            min-width: 0;
        }

        /* Thumbnails */
        .thumbnails-panel {
            background: var(--bg-darker);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .thumb {
            aspect-ratio: 16/9;
            background: var(--slide-bg);
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .thumb:hover {
            border-color: var(--border);
        }

        .thumb.active {
            border-color: var(--accent);
        }

        .thumb-num {
            position: absolute;
            top: 3px;
            left: 4px;
            font-size: 9px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 5px;
            border-radius: 2px;
            z-index: 10;
        }

        .thumb-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            border: none;
            pointer-events: none;
            transform-origin: top left;
        }

        .add-btn {
            padding: 8px;
            background: transparent;
            border: 2px dashed var(--border);
            color: var(--text-dim);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .add-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .no-slides {
            text-align: center;
            color: var(--text-dim);
            padding: 30px 10px;
            font-size: 12px;
        }

        .no-slides i {
            font-size: 32px;
            margin-bottom: 10px;
            opacity: 0.3;
            display: block;
        }

        /* Editor */
        .editor-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        .panel-header {
            height: 36px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .monaco-editor-container {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* Preview */
        .preview-panel {
            display: flex;
            flex-direction: column;
            background: #111;
            overflow: hidden;
        }

        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
            min-height: 0;
        }

        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-content {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
            border: none;
            display: block;
        }

        /* Presentation Mode */
        .presentation-mode {
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
        }

        /* Presentation Mode */
        .presentation-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .presentation-mode.active {
            display: flex;
        }

        .pres-wrapper {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pres-wrapper .slide-content {
            transform-origin: center center;
        }

        .pres-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .presentation-mode:hover .pres-controls {
            opacity: 1;
        }

        .pres-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
        }

        .pres-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        @media (hover: none) {
            .pres-controls {
                opacity: 1;
            }

            .pres-btn:active {
                background: rgba(255, 255, 255, 0.3);
            }
        }

        .pres-counter {
            position: fixed;
            bottom: 28px;
            right: 90px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            z-index: 1001;
        }

        /* Animations */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .anim-slide-right {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .anim-slide-left {
            animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .anim-fade {
            animation: fadeIn 0.4s ease;
        }

        .anim-zoom {
            animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .anim-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Text Reveal Transition */
        @keyframes textReveal {
            from {
                opacity: 0;
                transform: translateY(35px);
                filter: blur(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }



        /* AI Chat Panel */
        .chat-fab {
            position: fixed;
            right: max(24px, env(safe-area-inset-right));
            bottom: calc(24px + env(safe-area-inset-bottom));
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .chat-fab:hover {
            transform: scale(1.08);
            background: #3a6fbf;
        }

        .chat-fab.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.6);
        }

        body.presenting .chat-fab {
            display: none;
        }

        body.presenting .chat-panel {
            display: none;
        }

        .chat-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            height: auto;
            height: 100vh;
            height: 100dvh;
            width: 400px;
            max-width: 100vw;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateX(105%);
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1600;
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.55);
            overscroll-behavior: contain;
        }

        .chat-panel.open {
            transform: translateX(0);
        }

        .chat-header {
            height: 50px;
            background: var(--bg-darker);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            white-space: nowrap;
        }

        .chat-title i {
            color: var(--accent);
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
            margin-left: auto;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: #2ea043;
            box-shadow: 0 0 8px rgba(46, 160, 67, 0.8);
        }

        .chat-close {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 15px;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .chat-close:hover {
            background: var(--bg-panel);
            color: var(--text);
        }

        .chat-new {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            padding: 5px 9px;
            border-radius: 4px;
            transition: all 0.2s;
            margin-left: 6px;
        }

        .chat-new:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .chat-empty {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
        }

        .chat-empty i {
            font-size: 30px;
            opacity: 0.3;
            display: block;
            margin-bottom: 10px;
        }

        .msg {
            max-width: 85%;
            padding: 9px 13px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bg-darker);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 3px;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 3px;
        }

        .msg.empty {
            color: var(--text-dim);
            font-style: italic;
        }

        .msg.thinking {
            align-self: flex-start;
            background: transparent;
            border: none;
            padding: 4px 13px;
            color: var(--text-dim);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .msg.thinking .think-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: thinkPulse 1.2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes thinkPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .msg.thinking .think-time {
            font-variant-numeric: tabular-nums;
            opacity: 0.7;
        }

        .msg.thinking.thought {
            font-style: italic;
            opacity: 0.65;
        }

        .msg.thinking.thought .think-dot,
        .msg.thinking.thought .think-time {
            display: none;
        }

        .msg.retry {
            align-self: flex-start;
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid #dc2626;
            color: #dc2626;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .msg-reasoning {
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-dim);
            font-style: italic;
            margin: 6px 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--border);
            background: rgba(127, 127, 127, 0.07);
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-reasoning .reasoning-label {
            display: block;
            font-weight: 600;
            margin-bottom: 3px;
            opacity: 0.85;
        }

        .msg-reasoning .reasoning-label i {
            margin-right: 4px;
        }

        .msg p {
            margin: 0 0 8px;
        }

        .msg p:last-child {
            margin-bottom: 0;
        }

        .msg h1,
        .msg h2,
        .msg h3,
        .msg h4,
        .msg h5,
        .msg h6 {
            margin: 10px 0 6px;
            color: var(--text);
            font-size: 1em;
            font-weight: 600;
            line-height: 1.4;
        }

        .msg h1:first-child,
        .msg h2:first-child,
        .msg h3:first-child,
        .msg h4:first-child,
        .msg h5:first-child,
        .msg h6:first-child {
            margin-top: 0;
        }

        .msg ul,
        .msg ol {
            margin: 6px 0;
            padding-left: 22px;
        }

        .msg li {
            margin: 2px 0;
        }

        .msg li.task {
            list-style: none;
            margin-left: -16px;
        }

        .msg li.task input {
            margin-right: 4px;
            accent-color: var(--accent);
        }

        .msg li>p {
            margin: 0;
        }

        .msg a {
            color: #6cb6ff;
            text-decoration: underline;
        }

        .msg code {
            background: rgba(110, 118, 129, 0.25);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.92em;
        }

        .msg pre {
            background: var(--bg-darker);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin: 8px 0;
            overflow-x: auto;
            position: relative;
        }

        .msg pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 12px;
            line-height: 1.5;
        }

        .msg blockquote {
            border-left: 3px solid var(--accent);
            margin: 8px 0;
            padding: 2px 0 2px 12px;
            color: var(--text-dim);
        }

        .msg table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 0.92em;
            width: 100%;
        }

        .msg th,
        .msg td {
            border: 1px solid var(--border);
            padding: 5px 9px;
            text-align: left;
        }

        .msg th {
            background: var(--bg-darker);
            font-weight: 600;
        }

        .msg hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 10px 0;
        }

        .msg strong {
            color: #fff;
        }

        .msg.user p {
            margin: 0;
        }

        .slide-tag {
            margin: 8px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-darker);
            overflow: hidden;
        }

        .slide-tag-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            user-select: none;
        }

        .slide-tag-head:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .slide-tag-head .slide-tag-icon {
            color: var(--accent);
        }

        .slide-tag-head .slide-tag-icon.done {
            color: #2ea043;
        }

        .slide-tag.closed .slide-tag-head {
            opacity: 0.85;
        }

        .slide-tag-head .slide-tag-caret {
            margin-left: auto;
            color: var(--text-dim);
            font-size: 10px;
            transition: transform 0.2s;
        }

        .slide-tag.open .slide-tag-caret {
            transform: rotate(180deg);
        }

        .slide-tag-code {
            margin: 0;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: #0b0b0b;
            overflow: auto;
            max-height: 280px;
            font-size: 11px;
            line-height: 1.5;
            display: none;
        }

        .slide-tag.open .slide-tag-code {
            display: block;
        }

        .slide-tag-code code {
            background: none;
            border: none;
            padding: 0;
        }

        .web-search-tag {
            display: block;
            width: 100%;
            margin: 8px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-darker);
            overflow: hidden;
        }

        .web-search-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            user-select: none;
        }

        .web-search-head>span {
            white-space: nowrap;
        }

        .web-search-head:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .web-search-head .web-search-icon {
            color: #d29922;
        }

        .web-search-head .web-search-icon.done {
            color: #2ea043;
        }

        .web-search-head .web-search-query {
            color: var(--text-dim);
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .web-search-tag .slide-tag-caret {
            margin-left: auto;
            color: var(--text-dim);
            font-size: 10px;
            transition: transform 0.2s;
        }

        .web-search-tag.open .slide-tag-caret {
            transform: rotate(180deg);
        }

        .web-search-results {
            display: none;
            border-top: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 12px;
            max-height: 220px;
            overflow-y: auto;
        }

        .web-search-tag.open .web-search-results {
            display: block;
        }

        .web-search-results .ws-empty {
            color: var(--text-dim);
            font-style: italic;
        }

        .web-search-results ul {
            margin: 0;
            padding-left: 18px;
        }

        .web-search-results li {
            margin: 3px 0;
            color: var(--text);
        }

        .web-search-results li a {
            color: #6cb6ff;
        }

        .open-url-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-darker);
            color: var(--text);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 100%;
        }

        .open-url-tag:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .open-url-tag .open-url-icon {
            color: #2ea043;
            flex-shrink: 0;
        }

        .open-url-tag:hover .open-url-icon {
            color: #fff;
        }

        .open-url-tag .open-url-label {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .open-url-tag .open-url-addr {
            color: var(--text-dim);
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .open-url-tag:hover .open-url-addr {
            color: rgba(255, 255, 255, 0.8);
        }

        .open-url-tag .open-url-external {
            margin-left: auto;
            flex-shrink: 0;
            font-size: 10px;
            opacity: 0.6;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 12px 14px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: var(--bg-darker);
            flex-shrink: 0;
        }

        .chat-form input {
            flex: 1;
            min-width: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 9px 16px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .chat-form input:focus {
            border-color: var(--accent);
        }

        .chat-form button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .chat-form button:hover:not(:disabled) {
            background: #3a6fbf;
        }

        .chat-form button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Auth */
        .auth-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .auth-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .auth-chip i {
            color: var(--accent);
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .auth-overlay.open {
            display: flex;
        }

        .auth-modal {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            width: 320px;
            max-width: calc(100vw - 32px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-modal input {
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 10px;
            background: var(--bg-darker);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .auth-modal input:focus {
            border-color: var(--accent);
        }

        .auth-error {
            color: #e06c75;
            font-size: 12px;
            min-height: 16px;
            margin-bottom: 8px;
        }

        .auth-submit {
            width: 100%;
            justify-content: center;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 60px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            transform: translateX(120%);
            transition: transform 0.3s;
            z-index: 2000;
            pointer-events: none;
            max-width: calc(100vw - 40px);
        }

        .notification.show {
            transform: translateX(0);
        }

        /* ============ Mobile / responsive ============ */
        @media (max-width: 900px) {

            /* Tab bar: Code / Preview (only shown on small screens) */
            .mobile-tabs {
                display: flex;
                gap: 6px;
                padding: 6px 8px;
                background: var(--bg-darker);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
                z-index: 6;
            }

            .mobile-tabs button {
                flex: 1;
                min-height: 40px;
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text-dim);
                font-size: 13px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                cursor: pointer;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                transition: all 0.2s;
            }

            .mobile-tabs button.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }

            /* Stack the three panels vertically instead of 3 columns */
            .main-container {
                display: flex;
                flex-direction: column;
                grid-template-columns: none;
            }

            .editor-panel,
            .preview-panel {
                flex: 1;
                min-height: 0;
                border-right: none;
            }

            body[data-view="code"] .preview-panel {
                display: none;
            }

            body[data-view="preview"] .editor-panel {
                display: none;
            }

            /* Slide strip on top */
            .thumbnails-panel {
                flex: 0 0 auto;
                flex-direction: row;
                align-items: center;
                height: 96px;
                padding: 8px;
                gap: 8px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .thumbnails-panel::-webkit-scrollbar {
                height: 0;
                width: 0;
            }

            .thumb {
                width: 128px;
                height: 72px;
                flex: 0 0 auto;
            }

            .add-btn {
                flex: 0 0 auto;
                min-width: 96px;
                align-self: stretch;
            }

            .no-slides {
                padding: 0 12px;
                white-space: nowrap;
            }

            .no-slides i {
                display: inline-block;
                margin: 0 8px 0 0;
                font-size: 18px;
            }

            .panel-header {
                height: 34px;
            }
        }

        @media (max-width: 640px) {
            .toolbar {
                height: 46px;
                padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
                gap: 8px;
            }

            .toolbar-brand {
                display: none;
            }

            .toolbar-divider {
                display: none;
            }

            .toolbar-btn {
                padding: 7px 11px;
                font-size: 12px;
            }

            /* Chat panel takes the whole screen */
            .chat-panel {
                width: 100vw;
                border-left: none;
                box-shadow: none;
            }

            .chat-header {
                padding: 0 8px 0 12px;
                padding-top: env(safe-area-inset-top);
                height: auto;
                min-height: 50px;
                gap: 6px;
            }

            .chat-title {
                font-size: 12px;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .chat-new {
                margin-left: 4px;
            }

            .chat-body {
                padding: 14px 12px;
                -webkit-overflow-scrolling: touch;
            }

            .msg {
                max-width: 92%;
            }

            /* 16px stops iOS Safari from zooming the page when the field is focused */
            .chat-form {
                padding: 10px 10px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
                gap: 8px;
            }

            .chat-form input {
                font-size: 16px;
                padding: 10px 14px;
            }

            .auth-modal input {
                font-size: 16px;
            }

            .notification {
                right: 10px;
                left: 10px;
                top: auto;
                bottom: calc(88px + env(safe-area-inset-bottom));
                text-align: center;
                transform: translateY(calc(200% + 100px));
            }

            .notification.show {
                transform: translateY(0);
            }

            .pres-counter {
                right: 16px;
                bottom: calc(76px + env(safe-area-inset-bottom));
            }

            .pres-controls {
                bottom: calc(16px + env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 380px) {
            .mobile-tabs button {
                font-size: 12px;
                gap: 5px;
            }

            .toolbar-btn {
                padding: 7px 9px;
            }
        }
    </style>
</head>

<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-brand"><i class="fas fa-desktop"></i> HTML Slide Editor</div>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" onclick="editor.addSlide()"><i class="fas fa-plus"></i> New</button>
        <button class="toolbar-btn" onclick="editor.duplicateSlide()"><i class="fas fa-copy"></i></button>
        <button class="toolbar-btn" onclick="editor.deleteSlide()"><i class="fas fa-trash"></i></button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" onclick="editor.togglePresentation()"><i class="fas fa-play"></i> Present</button>
        <button class="toolbar-btn" onclick="editor.exportHTML()"><i class="fas fa-file-export"></i> Export
            HTML</button>
        <button class="toolbar-btn" onclick="editor.exportProject()"><i class="fas fa-download"></i> Save
            Project</button>
        <button class="toolbar-btn" onclick="document.getElementById('importFile').click()"><i
                class="fas fa-upload"></i> Load Project</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="editor.importProject(this)">
        <div class="toolbar-divider"></div>
        <span style="font-size:11px;color:var(--text-dim);white-space:nowrap;">Transition:</span>
        <button class="trans-btn active" onclick="editor.setTransition('slide-right')"
            data-t="slide-right">Slide</button>
        <button class="trans-btn" onclick="editor.setTransition('fade')" data-t="fade">Fade</button>
        <button class="trans-btn" onclick="editor.setTransition('zoom')" data-t="zoom">Zoom</button>
        <button class="trans-btn" onclick="editor.setTransition('slide-up')" data-t="slide-up">Up</button>
        <button class="trans-btn" onclick="editor.setTransition('text')" data-t="text">Text</button>
        <div class="auth-area">
            <button class="toolbar-btn" id="authLoginBtn" onclick="authUI.openLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
            <span class="auth-chip" id="authUserChip" style="display:none;"><i class="fas fa-user-circle"></i> <span id="authUsername"></span></span>
            <button class="toolbar-btn" id="authAddUserBtn" style="display:none;" onclick="authUI.openAddUser()" title="Add user"><i class="fas fa-user-plus"></i></button>
            <button class="toolbar-btn" id="authLogoutBtn" style="display:none;" onclick="authUI.logout()" title="Logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <!-- Mobile tab bar (visible only on small screens) -->
    <div class="mobile-tabs" id="mobileTabs">
        <button type="button" data-view="preview"><i class="fas fa-eye"></i> Preview</button>
        <button type="button" data-view="code"><i class="fas fa-code"></i> Code</button>
    </div>


    <!-- Main -->
    <div class="main-container" id="mainContainer">

        <!-- Left: Thumbnails -->
        <div class="thumbnails-panel" id="thumbnailsPanel">
            <div class="no-slides">
                <i class="fas fa-file-code"></i>
                <div>No slides yet</div>
            </div>
        </div>

        <!-- Center: HTML Editor -->
        <div class="editor-panel">
            <div class="panel-header">
                <span><i class="fas fa-code"></i> HTML Source</span>
                <div style="display:flex;gap:6px;">
                    <button class="toolbar-btn" onclick="editor.formatCode()" style="padding:2px 10px;font-size:11px;"
                        title="Format Document (Alt+Shift+F)"><i class="fas fa-align-left"></i> Format</button>
                    <button class="toolbar-btn" onclick="editor.applyChanges()"
                        style="padding:2px 10px;font-size:11px;"><i class="fas fa-sync"></i> Apply</button>
                </div>
            </div>
            <div id="htmlEditor" class="monaco-editor-container"></div>
        </div>

        <!-- Right: Preview -->
        <div class="preview-panel">
            <div class="panel-header">
                <span><i class="fas fa-eye"></i> Live Preview</span>
            </div>
            <div class="preview-area">
                <div class="slide-wrapper" id="previewWrapper">
                    <iframe class="slide-content" id="previewContent"></iframe>
                </div>
            </div>
        </div>

    </div>

    <!-- Presentation Mode Overlay -->
    <div id="presentationMode" class="presentation-mode">
        <div class="pres-wrapper">
            <iframe class="slide-content" id="presContent"></iframe>
        </div>
        <div class="pres-controls">
            <button class="pres-btn" onclick="editor.prevSlide()" title="Previous"><i
                    class="fas fa-chevron-left"></i></button>
            <button class="pres-btn" onclick="editor.togglePresentation()" title="Exit"><i
                    class="fas fa-times"></i></button>
            <button class="pres-btn" onclick="editor.nextSlide()" title="Next"><i
                    class="fas fa-chevron-right"></i></button>
        </div>
        <div class="pres-counter" id="presCounter">1 / 1</div>
    </div>

    <!-- Notification Toast -->
    <div class="notification" id="notification">Ready!</div>

    <!-- Auth Modal -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <div class="auth-modal-title" id="authModalTitle"><i class="fas fa-sign-in-alt"></i> Login</div>
            <form id="authForm" autocomplete="off">
                <input type="text" id="authUserInput" placeholder="Username" autocomplete="username" required>
                <input type="password" id="authPassInput" placeholder="Password" autocomplete="current-password" required>
                <div class="auth-error" id="authError"></div>
                <button type="submit" class="toolbar-btn auth-submit" id="authSubmitBtn"><span id="authSubmitLabel">Login</span></button>
            </form>
        </div>
    </div>

    <!-- AI Chat -->
    <button class="chat-fab" id="chatFab" title="AI Assistant (Ctrl+J)"><i class="fas fa-robot"></i></button>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="chat-title"><i class="fas fa-robot"></i> AI Assistant</div>
            <div class="chat-status">
                <span class="status-dot" id="chatStatusDot"></span>
                <span id="chatState">offline</span>
            </div>
            <button class="chat-new" id="chatNew" title="New chat (fresh session)"><i class="fas fa-plus"></i></button>
            <button class="chat-close" id="chatClose" title="Close"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-empty" id="chatEmpty">
                <i class="fas fa-comment-dots"></i>
                <div>Start a conversation with the AI assistant</div>
            </div>
        </div>
        <form class="chat-form" id="chatForm" autocomplete="off">
            <input type="text" id="chatInput" placeholder="Ask something…" enterkeyhint="send"
                autocapitalize="sentences" autocomplete="off" autocorrect="on" />
            <button type="submit" id="chatSendBtn" disabled aria-label="Send message"><i
                    class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
        (function () {
            'use strict';

            var editor = {
                slides: [],
                currentIndex: -1,
                transition: 'slide-right',
                autoApplyTimer: null,

                addSlide: function () {
                    this.slides.push({ id: Date.now(), html: this.defaultTemplate(), transition: this.transition });
                    this.selectSlide(this.slides.length - 1);
                    this.saveToStorage();
                    this.notify('New slide added');
                },

                duplicateSlide: function () {
                    if (this.currentIndex === -1) return;
                    this.slides.splice(this.currentIndex + 1, 0, {
                        id: Date.now(),
                        html: this.slides[this.currentIndex].html,
                        transition: this.slides[this.currentIndex].transition
                    });
                    this.selectSlide(this.currentIndex + 1);
                    this.saveToStorage();
                    this.notify('Slide duplicated');
                },

                deleteSlide: function () {
                    if (this.currentIndex === -1 || !this.slides.length) return;
                    this.slides.splice(this.currentIndex, 1);
                    this.currentIndex = Math.min(this.currentIndex, this.slides.length - 1);
                    this.selectSlide(this.currentIndex);
                    this.saveToStorage();
                    this.notify('Slide deleted');
                },

                selectSlide: function (idx) {
                    var previewEl = document.getElementById('previewContent');
                    if (idx < 0 || idx >= this.slides.length) {
                        this.currentIndex = -1;
                        if (window.monacoEditor) window.monacoEditor.setValue('');
                        if (previewEl && previewEl.contentDocument) {
                            var doc = previewEl.contentDocument;
                            doc.open();
                            doc.write('<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#555;"><div style="text-align:center;"><i class="fas fa-arrow-left" style="font-size:40px;margin-bottom:15px;opacity:0.3;"></i><p>Add or select a slide</p></div></div>');
                            doc.close();
                        }
                    } else {
                        this.currentIndex = idx;
                        if (window.monacoEditor) window.monacoEditor.setValue(this.slides[idx].html);
                        this.renderPreview();
                    }
                    this.renderThumbnails();
                },

                applyChanges: function () {
                    if (this.currentIndex === -1) return;
                    if (window.monacoEditor) {
                        this.slides[this.currentIndex].html = window.monacoEditor.getValue();
                        this.renderPreview();
                        this.renderThumbnails();
                        this.saveToStorage();
                        this.notify('Changes applied');
                    }
                },

                formatCode: function () {
                    if (window.monacoEditor) {
                        window.monacoEditor.trigger('format', 'editor.action.formatDocument');
                        this.notify('Document formatted');
                    }
                },

                getSlideDimensions: function (html) {
                    var fallback = { width: 1280, height: 720 };

                    if (!html || typeof html !== 'string') {
                        return fallback;
                    }

                    // 1. Look for an explicit .slide-container width/height
                    var containerMatch = html.match(
                        /\.slide-container[\s\S]*?width\s*:\s*(\d+(?:\.\d+)?)px[\s\S]*?height\s*:\s*(\d+(?:\.\d+)?)px/i
                    );

                    if (containerMatch) {
                        return {
                            width: parseFloat(containerMatch[1]),
                            height: parseFloat(containerMatch[2])
                        };
                    }

                    // 2. Look for width/height on an element with data-screen-label
                    var screenMatch = html.match(
                        /data-screen-label[\s\S]*?style\s*=\s*["'][\s\S]*?width\s*:\s*(\d+(?:\.\d+)?)px[\s\S]*?height\s*:\s*(\d+(?:\.\d+)?)px/i
                    );

                    if (screenMatch) {
                        return {
                            width: parseFloat(screenMatch[1]),
                            height: parseFloat(screenMatch[2])
                        };
                    }

                    // 3. Look for the first large fixed-width/fixed-height element
                    var dimensionsMatch = html.match(
                        /width\s*:\s*(\d+(?:\.\d+)?)px[\s\S]{0,500}?height\s*:\s*(\d+(?:\.\d+)?)px/i
                    );

                    if (dimensionsMatch) {
                        var width = parseFloat(dimensionsMatch[1]);
                        var height = parseFloat(dimensionsMatch[2]);

                        // Avoid accidentally detecting tiny objects.
                        if (width >= 500 && height >= 300) {
                            return {
                                width: width,
                                height: height
                            };
                        }
                    }

                    return fallback;
                },

                getRenderedSlideDimensions: function (iframe, html) {
                    var detected = this.getSlideDimensions(html);

                    if (!iframe || !iframe.contentDocument) {
                        return detected;
                    }

                    var doc = iframe.contentDocument;
                    var root = doc.documentElement;
                    var body = doc.body;

                    var candidates = [];

                    // Explicit slide container
                    var container = doc.querySelector('.slide-container');

                    if (container) {
                        var rect = container.getBoundingClientRect();

                        if (rect.width > 0 && rect.height > 0) {
                            candidates.push({
                                width: rect.width,
                                height: rect.height
                            });
                        }

                        var style = iframe.contentWindow.getComputedStyle(container);

                        var cssWidth = parseFloat(style.width);
                        var cssHeight = parseFloat(style.height);

                        if (cssWidth > 0 && cssHeight > 0) {
                            candidates.push({
                                width: cssWidth,
                                height: cssHeight
                            });
                        }
                    }

                    // data-screen-label is another useful indicator
                    var screen = doc.querySelector('[data-screen-label]');

                    if (screen) {
                        var screenRect = screen.getBoundingClientRect();

                        if (screenRect.width > 0 && screenRect.height > 0) {
                            candidates.push({
                                width: screenRect.width,
                                height: screenRect.height
                            });
                        }
                    }

                    if (candidates.length) {
                        // Prefer the largest sensible candidate.
                        candidates.sort(function (a, b) {
                            return (b.width * b.height) - (a.width * a.height);
                        });

                        var result = candidates[0];

                        if (result.width >= 500 && result.height >= 300) {
                            return result;
                        }
                    }

                    return detected;
                },

                renderPreview: function () {
                    if (this.currentIndex === -1) return;

                    var html = this.slides[this.currentIndex].html;
                    var previewEl = document.getElementById('previewContent');

                    if (!previewEl) return;

                    var self = this;

                    previewEl.onload = function () {
                        requestAnimationFrame(function () {
                            requestAnimationFrame(function () {
                                self.watchPreviewSize();
                                self.scalePreview();
                            });
                        });
                    };

                    if (previewEl.contentDocument) {
                        var doc = previewEl.contentDocument;

                        doc.open();
                        doc.write(html);
                        doc.close();

            function slideTagHtml(s) {
                var labels = { create: 'Creating', creating: 'Creating', insert: 'Inserting', inserting: 'Inserting', edit: 'Editing', editing: 'Editing', edit_part: 'Editing', delete: 'Deleting', deleted: 'Deleting' };
                var doneLabels = { create: 'Created', creating: 'Created', insert: 'Inserted', inserting: 'Inserted', edit: 'Edited', editing: 'Edited', edit_part: 'Edited', delete: 'Deleted', deleted: 'Deleted' };
                var label = (s.closed ? doneLabels : labels)[s.action] || (s.closed ? 'Done' : 'Updated');
                var body = s.body.replace(/^\n+|\n+$/g, '');
                var code = body
                    ? '<pre class="slide-tag-code"><code>' + escapeHtml(body) + '\n</code></pre>'
                    : '<pre class="slide-tag-code"><code><span style="color:var(--text-dim)">streaming…</span>\n</code></pre>';
                var spin = s.closed
                    ? '<i class="fas fa-check slide-tag-icon done"></i>'
                    : '<i class="fas fa-spinner fa-spin slide-tag-icon"></i>';
                return '<div class="slide-tag' + (openSlideKeys[s.key] ? ' open' : '') + (s.closed ? ' closed' : '') + '" data-key="' + s.key + '">' +
                    '<div class="slide-tag-head">' +
                    spin +
                    '<span>' + label + ' slide ' + s.index + '</span>' +
                    '<i class="fas fa-chevron-down slide-tag-caret"></i>' +
                    '</div>' + code + '</div>';
            }

            function restoreOpenSlideTags(el) {
                var tags = el.querySelectorAll('.slide-tag');
                for (var i = 0; i < tags.length; i++) {
                    if (openSlideKeys[tags[i].getAttribute('data-key')]) {
                        tags[i].classList.add('open');
                    }
                }
            }

            chatBody.addEventListener('click', function (e) {
                var head = e.target.closest ? e.target.closest('.slide-tag-head, .web-search-head') : null;
                if (!head) return;
                var tag = head.parentElement;
                var key = tag.getAttribute('data-key');
                tag.classList.toggle('open');
                if (tag.classList.contains('open')) openSlideKeys[key] = true;
                else delete openSlideKeys[key];
                chatBody.scrollTop = chatBody.scrollHeight;
            });

            function inlineMd(s) {
                return s
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
                    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
                    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            }

            function mdToHtml(src) {
                var lines = escapeHtml(src).replace(/\r\n?/g, '\n').split('\n');
                var out = [];
                var i = 0;

                function isList(l) { return /^\s*([-*+]|\d+[.)])\s+/.test(l); }

                while (i < lines.length) {
                    var line = lines[i];

                    if (/^\s*$/.test(line)) { i++; continue; }

                    if (/^```/.test(line)) {
                        var lang = line.slice(3).trim();
                        var buf = [];
                        i++;
                        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
                        i++;
                        out.push('<pre><code' + (lang ? ' class="lang-' + lang + '"' : '') + '>' + buf.join('\n') + '</code></pre>');
                        continue;
                    }

                    var h = line.match(/^(#{1,6})\s+(.*)$/);
                    if (h) {
                        var lvl = h[1].length;
                        out.push('<h' + lvl + '>' + inlineMd(h[2]) + '</h' + lvl + '>');
                        i++;
                        continue;
                    }

                    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

                    if (/^\s*&gt;\s?/.test(line)) {
                        var q = [];
                        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
                            q.push(lines[i].replace(/^\s*&gt;\s?/, ''));
                            i++;
                        }
                        out.push('<blockquote>' + mdToHtml(q.join('\n')) + '</blockquote>');
                        continue;
                    }

                    if (/^\s*\|.+\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
                        var cells = function (l) {
                            return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
                        };
                        var head = cells(line);
                        i += 2;
                        var rows = [];
                        while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
                        var th = head.map(function (c) { return '<th>' + inlineMd(c) + '</th>'; }).join('');
                        var tb = rows.map(function (r) {
                            return '<tr>' + r.map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
                        }).join('');
                        out.push('<table><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody></table>');
                        continue;
                    }

                    if (isList(line)) {
                        var ordered = /^\s*\d+[.)]\s+/.test(line);
                        var items = [];
                        while (i < lines.length && isList(lines[i])) {
                            var item = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
                            i++;
                            while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isList(lines[i])) {
                                item += ' ' + lines[i].trim();
                                i++;
                            }
                            var sub = item.match(/^(\[[ xX]\]\s+)([\s\S]*)$/);
                            if (sub) {
                                items.push('<li class="task"><input type="checkbox" disabled' +
                                    (/[xX]/.test(sub[1]) ? ' checked' : '') + '> ' + inlineMd(sub[2]) + '</li>');
                            } else {
                                items.push('<li>' + inlineMd(item) + '</li>');
                            }
                        }
                        out.push('<' + (ordered ? 'ol' : 'ul') + '>' + items.join('') + '</' + (ordered ? 'ol' : 'ul') + '>');
                        continue;
                    }

                    var para = [line];
                    i++;
                    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
                        !/^```/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) &&
                        !isList(lines[i]) && !/^\s*&gt;\s?/.test(lines[i]) &&
                        !/^\s*\|.+\|\s*$/.test(lines[i]) &&
                        !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
                        para.push(lines[i]);
                        i++;
                    }
                    out.push('<p>' + inlineMd(para.join('<br>')) + '</p>');
                }

                return out.join('\n');
            }

            function render(el, text) {
                var blocks = el._reasonBlocks || [];
                var renderText = text;
                if (blocks.length && el.classList.contains('bot') && !el.classList.contains('empty')) {
                    // Frozen blocks already have their marker baked into the text;
                    // only the still-active block gets injected at its offset.
                    var order = [];
                    for (var bi2 = 0; bi2 < blocks.length; bi2++) {
                        if (!blocks[bi2].frozen) order.push({ at: blocks[bi2].at, i: bi2 });
                    }
                    order.sort(function (a, b) { return b.at - a.at; });
                    for (var k = 0; k < order.length; k++) {
                        var p = Math.max(0, Math.min(order[k].at, renderText.length));
                        renderText = renderText.slice(0, p) + "\n%%REASON" + order[k].i + "%%\n" + renderText.slice(p);
                    }
                }
                if (el.classList.contains('bot') && !el.classList.contains('empty')) {
                    var ex = extractSlideTags(renderText);
                    var wx = extractWebSearchTags(ex.text);
                    var ou = extractOpenUrlTags(wx.text);
                    if (ex.slides.length) syncSlidesFromText(text, false);
                    var html = mdToHtml(ou.text);
                    html = html.replace(/<p>\s*(%%(?:SLIDE|WEBSEARCH|OPENURL)\d+%%)\s*<\/p>/g, '$1');
                    html = html.replace(/<p>\s*%%REASON(\d+)%%\s*<\/p>/g, '<span class="reason-anchor" data-b="$1"></span>');
                    html = html.replace(/%%REASON(\d+)%%/g, '<span class="reason-anchor" data-b="$1"></span>');
                    html = html.replace(/%%SLIDE(\d+)%%/g, function (_, n) {
                        return slideTagHtml(ex.slides[+n]);
                    });
                    html = html.replace(/%%WEBSEARCH(\d+)%%/g, function (_, n) {
                        return webSearchHtml(wx.searches[+n]);
                    });
                    html = html.replace(/%%OPENURL(\d+)%%/g, function (_, n) {
                        return openUrlHtml(ou.urls[+n]);
                    });
                    el.innerHTML = html;
                    restoreOpenSlideTags(el);
                    var anchors = el.querySelectorAll(".reason-anchor");
                    for (var ai = 0; ai < anchors.length; ai++) {
                        var bi = parseInt(anchors[ai].getAttribute("data-b"), 10);
                        if (blocks[bi]) anchors[ai].parentNode.replaceChild(blocks[bi].el, anchors[ai]);
                    }
                    var codes = el.querySelectorAll('.slide-tag.open .slide-tag-code');
                    for (var ci = 0; ci < codes.length; ci++) {
                        codes[ci].scrollTop = codes[ci].scrollHeight;
                    }
                } else {
                    el.textContent = text;
                }
                placeReasoning(el);
                if (!el._done) {
                    var c = document.createElement("span");
                    c.className = "cursor";
                    el.appendChild(c);
                }
                chatBody.scrollTop = chatBody.scrollHeight;
            }

            function finish(el) {
                el._done = true;
                var c = el.querySelector(".cursor");
                if (c) c.remove();
            }

            function setBusy(b) {
                busy = b;
                sendBtn.disabled = b || !ws || ws.readyState !== WebSocket.OPEN;
            }

            function buildSystemContext() {
                var idx = (window.editor && editor.currentIndex >= 0) ? editor.currentIndex + 1 : 0;
                var parts = [];
                if (window.editor && editor.slides.length) {
                    for (var i = 0; i < editor.slides.length; i++) {
                        parts.push('--- Slide ' + (i + 1) + ' ---\n' + editor.slides[i].html);
                    }
                }
                var rules = [
                    'System: Current slide: ' + idx + ' slide:',
                    parts.join('\n\n') || '(no slides)'
                ];
                return rules.join('\n');
            }

            chatForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var text = chatInput.value.trim();
                if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;

                addMsg("user", text);
                chatInput.value = "";
                ws.send(buildSystemContext() + '\n\nUser: ' + text);
                showThinking();
            });
        })();
    </script>

    <script>
        (function () {
            'use strict';

            /* ---------- Mobile tab bar: Preview / Code ---------- */
            var tabs = document.getElementById('mobileTabs');
            if (tabs) {
                var tabButtons = tabs.querySelectorAll('button');

                var setView = function (v) {
                    document.body.setAttribute('data-view', v);
                    for (var i = 0; i < tabButtons.length; i++) {
                        var b = tabButtons[i];
                        if (b.getAttribute('data-view') === v) b.classList.add('active');
                        else b.classList.remove('active');
                    }
                    if (v === 'preview') {
                        requestAnimationFrame(function () {
                            requestAnimationFrame(function () {
                                if (window.editor) window.editor.scalePreview();
                            });
                        });
                    } else if (v === 'code' && window.monacoEditor) {
                        setTimeout(function () {
                            try { window.monacoEditor.layout(); } catch (e) { }
                        }, 0);
                    }
                };

                tabs.addEventListener('click', function (e) {
                    var t = e.target;
                    while (t && t !== tabs && !(t.getAttribute && t.getAttribute('data-view'))) t = t.parentNode;
                    if (t && t !== tabs && t.getAttribute && t.getAttribute('data-view')) {
                        setView(t.getAttribute('data-view'));
                    }
                });

                var isSmall = window.matchMedia ? window.matchMedia('(max-width: 900px)').matches : (window.innerWidth <= 900);
                setView(isSmall ? 'preview' : 'code');
            }

            /* ---------- Keep the chat panel (and its input) inside the visible viewport ---------- */
            var chatPanel = document.getElementById('chatPanel');
            var chatInput = document.getElementById('chatInput');
            var chatBodyEl = document.getElementById('chatBody');
            var vv = window.visualViewport;

            if (chatPanel) {
                var syncChatViewport = function () {
                    if (!chatPanel.classList.contains('open') || !vv) {
                        chatPanel.style.height = '';
                        chatPanel.style.top = '';
                        return;
                    }
                    chatPanel.style.height = Math.round(vv.height) + 'px';
                    chatPanel.style.top = Math.round(vv.offsetTop) + 'px';
                };

                if (vv) {
                    vv.addEventListener('resize', syncChatViewport);
                    vv.addEventListener('scroll', syncChatViewport);
                }
                window.addEventListener('resize', syncChatViewport);
                window.addEventListener('orientationchange', function () {
                    setTimeout(syncChatViewport, 250);
                });

                if (window.MutationObserver) {
                    new MutationObserver(syncChatViewport).observe(chatPanel, {
                        attributes: true,
                        attributeFilter: ['class']
                    });
                }

                if (chatInput) {
                    chatInput.addEventListener('focus', function () {
                        setTimeout(function () {
                            syncChatViewport();
                            if (chatBodyEl) chatBodyEl.scrollTop = chatBodyEl.scrollHeight;
                        }, 250);
                    });
                    chatInput.addEventListener('blur', function () {
                        setTimeout(syncChatViewport, 100);
                    });
                }
            }
        })();
    </script>
